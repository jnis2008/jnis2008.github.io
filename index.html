<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jnis2008</title>
  <!-- 導入方正幾何風格字體 Press Start 2P -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    /* 全局樣式 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* 置中容器 */
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
      max-width: 1000px;
      z-index: 1;
    }

    /* 1. jnis 主頁標題 (175%) */
    .typewriter-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 65px;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .typewriter {
      font-family: 'Press Start 2P', monospace, sans-serif;
      font-size: 6.1rem;
      text-transform: lowercase;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      border-right: 6px solid #ffffff;
      width: 0;
      animation: 
        typing 0.8s cubic-bezier(0.25, 0.1, 0.25, 1) forwards,
        blink-caret 0.6s step-end infinite;
    }

    @keyframes typing {
      from { width: 0; }
      to { width: 385px; }
    }

    @keyframes blink-caret {
      from, to { border-color: transparent; }
      50% { border-color: #ffffff; }
    }

    /* 2. 主頁中間按鈕 (背景與底色相同) */
    .btn-jnii {
      display: inline-block;
      padding: 18px 46px;
      font-size: 1.43rem;
      font-weight: 600;
      color: #ffffff;
      text-decoration: none;
      border: 3px solid #ffffff;
      border-radius: 9px;
      background-color: #0d0d0d; /* 與網頁背景同色 */
      letter-spacing: 1.6px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 110px;
      
      opacity: 0;
      transform: scale(0.92);
      animation: fadeInBtn 0.4s ease-out 0.7s forwards;
    }

    .btn-jnii:hover {
      background-color: #ffffff;
      color: #0d0d0d;
      box-shadow: 0 0 22px rgba(255, 255, 255, 0.4);
      transform: scale(1.03);
    }

    @keyframes fadeInBtn {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* 3. 底部商務聯絡資訊 */
    .inquiry-text {
      font-size: 1.1rem;
      color: #aaaaaa;
      letter-spacing: 0.9px;
      white-space: nowrap;
      transition: opacity 0.4s ease, transform 0.4s ease;
      
      opacity: 0;
      animation: fadeInText 0.6s ease-out 1.1s forwards;
    }

    @keyframes fadeInText {
      to {
        opacity: 1;
      }
    }

    /* ===== 右上角固定標題 jnis ===== */
    .top-right-logo {
      position: absolute;
      top: 40px;
      right: 50px;
      font-family: 'Press Start 2P', monospace, sans-serif;
      font-size: 2.2rem;
      color: #ffffff;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-10px);
      transition: all 0.5s ease;
      z-index: 10;
    }

    .top-right-logo.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    /* ===== 第二頁白框選單區域 ===== */
    .links-menu {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      width: 100%;
      max-width: 480px;
      margin-bottom: 110px;
    }

    .links-menu.active {
      display: flex;
    }

    /* 白框基本樣式 (背景與底色相同) */
    .white-box-wrapper {
      width: 100%;
      position: relative;
      opacity: 0;
      transform: translateY(-50px);
      transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .links-menu.active .white-box-wrapper {
      opacity: 1;
      transform: translateY(0);
    }

    /* 由上而下延遲進入動畫 */
    .links-menu.active .white-box-wrapper:nth-child(1) { transition-delay: 0.1s; }
    .links-menu.active .white-box-wrapper:nth-child(2) { transition-delay: 0.25s; }
    .links-menu.active .white-box-wrapper:nth-child(3) { transition-delay: 0.4s; }

    .white-box {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 75px;
      border: 3.5px solid #ffffff;
      border-radius: 9px;
      background-color: #0d0d0d; /* 與網頁背景同色 */
      color: #ffffff;
      text-decoration: none;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .white-box:hover {
      background-color: #ffffff;
      color: #0d0d0d;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.4);
    }

    /* YouTube 下拉選單子選單容器 */
    .yt-dropdown {
      display: flex;
      justify-content: space-around;
      align-items: center;
      width: 100%;
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      background-color: #0d0d0d; /* 與網頁背景同色 */
      border: 2px solid #ffffff;
      border-radius: 0 0 9px 9px;
      border-top: none;
      transition: max-height 0.4s ease, opacity 0.3s ease, margin-top 0.3s ease;
      margin-top: 0;
    }

    /* 滑鼠懸停於 YT 區塊時彈出選單 */
    .white-box-wrapper.yt-wrapper:hover .yt-dropdown {
      max-height: 70px;
      opacity: 1;
      margin-top: 5px;
    }

    .yt-sub-btn {
      flex: 1;
      padding: 14px 0;
      color: #ffffff;
      text-decoration: none;
      font-size: 1.2rem;
      font-weight: 600;
      text-align: center;
      letter-spacing: 1px;
      transition: all 0.2s ease;
      background-color: #0d0d0d;
    }

    .yt-sub-btn:hover {
      background-color: #ffffff;
      color: #0d0d0d;
    }

    .yt-sub-btn:first-child {
      border-right: 1px solid rgba(255, 255, 255, 0.3);
    }

    /* 隱藏主頁元素的淡出樣式 */
    .fade-out {
      opacity: 0 !important;
      transform: translateY(-20px) !important;
      pointer-events: none;
    }

    /* 淡入效果 class */
    .fade-in {
      opacity: 1 !important;
      transform: translateY(0) !important;
    }
  </style>
</head>
<body>

  <!-- 右上角固定出現的 jnis -->
  <div class="top-right-logo" id="topLogo">jnis</div>

  <div class="container">
    <!-- 1. 主頁 jnis 打字標題 -->
    <div class="typewriter-wrapper" id="homeTitle">
      <h1 class="typewriter">jnis</h1>
    </div>

    <!-- 2. 主頁中間按鈕 -->
    <a href="javascript:void(0);" class="btn-jnii" id="btnJnii">@jnii2008</a>

    <!-- 3. 第二頁白框社群選單 -->
    <div class="links-menu" id="linksMenu">
      <!-- Twitch -->
      <div class="white-box-wrapper">
        <a href="https://www.twitch.tv/jnii2008" target="_blank" class="white-box">Twitch</a>
      </div>

      <!-- IG -->
      <div class="white-box-wrapper">
        <a href="https://www.instagram.com/jnii2008/" target="_blank" class="white-box">Instagram</a>
      </div>

      <!-- YouTube (懸停選單) -->
      <div class="white-box-wrapper yt-wrapper">
        <div class="white-box">YouTube</div>
        <div class="yt-dropdown">
          <a href="https://www.youtube.com/@jnii2008" target="_blank" class="yt-sub-btn">Main</a>
          <a href="https://www.youtube.com/@%E5%82%91%E5%B0%BC4" target="_blank" class="yt-sub-btn">VOD</a>
        </div>
      </div>
    </div>

    <!-- 4. 底部聯絡資訊 -->
    <p class="inquiry-text" id="inquiryText">
      Business Inquiries: jnis550088@gmail.com
    </p>
  </div>

  <script>
    const btnJnii = document.getElementById('btnJnii');
    const homeTitle = document.getElementById('homeTitle');
    const linksMenu = document.getElementById('linksMenu');
    const topLogo = document.getElementById('topLogo');
    const inquiryText = document.getElementById('inquiryText');

    btnJnii.addEventListener('click', function() {
      homeTitle.classList.add('fade-out');
      btnJnii.classList.add('fade-out');
      inquiryText.classList.add('fade-out');

      setTimeout(() => {
        homeTitle.style.display = 'none';
        btnJnii.style.display = 'none';

        topLogo.classList.add('visible');
        linksMenu.classList.active;
        linksMenu.classList.add('active');

        inquiryText.classList.remove('fade-out');
        inquiryText.classList.add('fade-in');
      }, 400);
    });
  </script>

</body>
</html>
