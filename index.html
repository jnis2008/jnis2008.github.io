<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jnis2008</title>
  <!-- 導入方正幾何風格字體 Press Start 2P -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    /* 全局變數 (預設為暗底 Dark Mode) */
    :root {
      --bg-color: #0d0d0d;
      --text-color: #ffffff;
      --border-color: #ffffff;
      --hover-bg: #ffffff;
      --hover-text: #0d0d0d;
      --box-shadow-color: rgba(255, 255, 255, 0.4);
      --inquiry-base: #888888;
      --inquiry-shine: #ffffff;
      --toast-color: #888888;
    }

    /* 亮底 Theme (Light Mode) */
    body.light-theme {
      --bg-color: #f5f5f5;
      --text-color: #0d0d0d;
      --border-color: #0d0d0d;
      --hover-bg: #0d0d0d;
      --hover-text: #ffffff;
      --box-shadow-color: rgba(0, 0, 0, 0.3);
      --inquiry-base: #555555;
      --inquiry-shine: #000000;
      --toast-color: #666666;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    /* ===== 1. 左上角切換主題按鈕 (黑白圖示) ===== */
    .theme-toggle-btn {
      position: absolute;
      top: 40px;
      left: 50px;
      background: transparent;
      border: 2px solid var(--border-color);
      color: var(--text-color);
      padding: 8px 18px;
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: 20px;
      cursor: pointer;
      z-index: 100;
      transition: all 0.3s ease;
    }

    .theme-toggle-btn:hover {
      background-color: var(--hover-bg);
      color: var(--hover-text);
      box-shadow: 0 0 15px var(--box-shadow-color);
    }

    /* ===== 右上角固定標題 jnis ===== */
    .top-right-logo {
      position: absolute;
      top: 40px;
      right: 50px;
      font-family: 'Press Start 2P', monospace, sans-serif;
      font-size: 2.2rem;
      color: var(--text-color);
      opacity: 0;
      pointer-events: none;
      transform: translateY(-20px);
      transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), text-shadow 0.3s ease;
      z-index: 10;
      cursor: pointer;
    }

    .top-right-logo.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .top-right-logo:hover {
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.9), 0 0 30px rgba(255, 255, 255, 0.6);
    }

    /* 置中容器 */
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
      max-width: 1000px;
      z-index: 1;
      position: relative;
    }

    /* 首頁打字標題 */
    .typewriter-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 65px;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .typewriter {
      font-family: 'Press Start 2P', monospace, sans-serif;
      font-size: 6.1rem;
      text-transform: lowercase;
      color: var(--text-color);
      white-space: nowrap;
      overflow: hidden;
      border-right: 6px solid var(--text-color);
      width: 0;
      animation: 
        typing 0.8s cubic-bezier(0.25, 0.1, 0.25, 1) forwards,
        blink-caret 0.6s step-end infinite;
    }

    @keyframes typing {
      from { width: 0; }
      to { width: 385px; }
    }

    @keyframes blink-caret {
      from, to { border-color: transparent; }
      50% { border-color: var(--text-color); }
    }

    /* 首頁中間按鈕 */
    .btn-jnii {
      display: inline-block;
      padding: 18px 46px;
      font-size: 1.43rem;
      font-weight: 600;
      color: var(--text-color);
      text-decoration: none;
      border: 3px solid var(--border-color);
      border-radius: 9px;
      background-color: var(--bg-color);
      letter-spacing: 1.6px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 110px;
      
      opacity: 0;
      transform: scale(0.92);
      animation: fadeInBtn 0.4s ease-out 0.7s forwards;
    }

    .btn-jnii:hover {
      background-color: var(--hover-bg);
      color: var(--hover-text);
      box-shadow: 0 0 22px var(--box-shadow-color);
      transform: scale(1.03);
    }

    @keyframes fadeInBtn {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* ===== 第二頁選單區域 ===== */
    .links-menu {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      width: 100%;
      max-width: 480px;
      margin-bottom: 110px;
    }

    .links-menu.active {
      display: flex;
    }

    .white-box-wrapper {
      width: 100%;
      position: relative;
      opacity: 0;
      transform: translateY(-80px) scale(0.95);
      transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), 
                  transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .links-menu.active .white-box-wrapper {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .links-menu.active .white-box-wrapper:nth-child(1) { transition-delay: 0.05s; }
    .links-menu.active .white-box-wrapper:nth-child(2) { transition-delay: 0.22s; }
    .links-menu.active .white-box-wrapper:nth-child(3) { transition-delay: 0.39s; }

    .white-box {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 75px;
      border: 3.5px solid var(--border-color);
      border-radius: 9px;
      background-color: var(--bg-color);
      color: var(--text-color);
      text-decoration: none;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .white-box:hover {
      background-color: var(--hover-bg);
      color: var(--hover-text);
      box-shadow: 0 0 25px var(--box-shadow-color);
    }

    /* ===== 3. YouTube 懸停顯示兩個獨立按鈕 ===== */
    .yt-sub-container {
      display: flex;
      gap: 15px;
      position: absolute;
      top: 85px;
      left: 0;
      width: 100%;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-8px);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 20;
    }

    .white-box-wrapper.yt-wrapper:hover .yt-sub-container {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .yt-btn {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 55px;
      border: 3px solid var(--border-color);
      border-radius: 8px;
      background-color: var(--bg-color);
      color: var(--text-color);
      text-decoration: none;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 1px;
      transition: all 0.3s ease;
    }

    .yt-btn:hover {
      background-color: var(--hover-bg);
      color: var(--hover-text);
      box-shadow: 0 0 18px var(--box-shadow-color);
    }

    /* ===== 2. 底部 Business Inquiries (可點擊與 Copied 提示) ===== */
    .inquiry-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .inquiry-text {
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: 0.9px;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      transition: opacity 0.6s ease, transform 0.6s ease;
      
      background: linear-gradient(90deg, var(--inquiry-base) 0%, var(--inquiry-base) 40%, var(--inquiry-shine) 50%, var(--inquiry-base) 60%, var(--inquiry-base) 100%);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 3s infinite linear;

      opacity: 0;
    }

    .inquiry-text.init-fadeIn {
      animation: fadeInText 0.6s ease-out 1.1s forwards, shimmer 3s infinite linear;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    @keyframes fadeInText {
      to { opacity: 1; }
    }

    /* Copied 灰字提示 */
    .copied-toast {
      position: absolute;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--toast-color);
      letter-spacing: 1px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    /* 首頁 Copied 顯示在下方 */
    .copied-toast.pos-bottom {
      top: 30px;
      transform: translateY(-5px);
    }

    /* 第二頁 Copied 顯示在上方 */
    .copied-toast.pos-top {
      bottom: 30px;
      transform: translateY(5px);
    }

    .copied-toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* 動畫輔助類別 */
    .fade-out {
      opacity: 0 !important;
      transform: translateY(-25px) !important;
      pointer-events: none;
    }

    .inquiry-hidden {
      opacity: 0 !important;
      transform: translateY(20px) !important;
    }

    .inquiry-visible {
      opacity: 1 !important;
      transform: translateY(0) !important;
    }
  </style>
</head>
<body>

  <!-- 1. 左上角切換暗底/亮底按鈕 (黑白圖示) -->
  <button class="theme-toggle-btn" id="themeToggleBtn">◯ Dark</button>

  <!-- 右上角固定出現的 jnis -->
  <div class="top-right-logo" id="topLogo">jnis</div>

  <div class="container">
    <!-- 首頁標題 -->
    <div class="typewriter-wrapper" id="homeTitle">
      <h1 class="typewriter">jnis</h1>
    </div>

    <!-- 首頁中間按鈕 -->
    <a href="javascript:void(0);" class="btn-jnii" id="btnJnii">@jnii2008</a>

    <!-- 第二頁選單 -->
    <div class="links-menu" id="linksMenu">
      <div class="white-box-wrapper">
        <a href="https://www.twitch.tv/jnii2008" target="_blank" class="white-box">Twitch</a>
      </div>

      <div class="white-box-wrapper">
        <a href="https://www.instagram.com/jnii2008/" target="_blank" class="white-box">Instagram</a>
      </div>

      <!-- YouTube (懸停顯示獨立按鈕) -->
      <div class="white-box-wrapper yt-wrapper">
        <div class="white-box">YouTube</div>
        <div class="yt-sub-container">
          <a href="https://www.youtube.com/@jnii2008" target="_blank" class="yt-btn">Main</a>
          <a href="https://www.youtube.com/@%E5%82%91%E5%B0%BC4" target="_blank" class="yt-btn">VOD</a>
        </div>
      </div>
    </div>

    <!-- 2. 底部聯絡資訊與複製提示 -->
    <div class="inquiry-wrapper">
      <div class="copied-toast pos-bottom" id="copiedToast">Copied!</div>
      <p class="inquiry-text init-fadeIn" id="inquiryText">
        Business Inquiries: jnis550088@gmail.com
      </p>
    </div>
  </div>

  <script>
    const btnJnii = document.getElementById('btnJnii');
    const homeTitle = document.getElementById('homeTitle');
    const linksMenu = document.getElementById('linksMenu');
    const topLogo = document.getElementById('topLogo');
    const inquiryText = document.getElementById('inquiryText');
    const copiedToast = document.getElementById('copiedToast');
    const themeToggleBtn = document.getElementById('themeToggleBtn');

    let isSecondPage = false;
    let toastTimeout;

    // 頁面切換 logic
    btnJnii.addEventListener('click', function() {
      isSecondPage = true;
      homeTitle.classList.add('fade-out');
      btnJnii.classList.add('fade-out');
      inquiryText.classList.remove('init-fadeIn');
      inquiryText.classList.add('inquiry-hidden');

      setTimeout(() => {
        homeTitle.style.display = 'none';
        btnJnii.style.display = 'none';

        linksMenu.classList.add('active');

        requestAnimationFrame(() => {
          topLogo.classList.add('visible');
          inquiryText.classList.remove('inquiry-hidden');
          inquiryText.classList.add('inquiry-visible');
        });
      }, 400);
    });

    // 點擊複製 Email 功能
    inquiryText.addEventListener('click', function() {
      const email = 'jnis550088@gmail.com';
      navigator.clipboard.writeText(email).then(() => {
        // 設定提示字位置 (第二頁在上方, 首頁在下方)
        if (isSecondPage) {
          copiedToast.classList.remove('pos-bottom');
          copiedToast.classList.add('pos-top');
        } else {
          copiedToast.classList.remove('pos-top');
          copiedToast.classList.add('pos-bottom');
        }

        // 顯示 Copied!
        copiedToast.classList.add('show');

        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
          copiedToast.classList.remove('show');
        }, 2000);
      });
    });

    // 亮底/暗底主題切換
    themeToggleBtn.addEventListener('click', function() {
      document.body.classList.toggle('light-theme');
      if (document.body.classList.contains('light-theme')) {
        themeToggleBtn.textContent = '● Light';
      } else {
        themeToggleBtn.textContent = '◯ Dark';
      }
    });
  </script>

</body>
</html>
