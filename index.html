<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jnis - twitch</title>
  <style>
    /* Global Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden; /* Prevent scrolling during animation */
    }

    /* Container for Layout */
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 30px; /* Space between elements */
      text-align: center;
      position: relative;
    }

    /* 1. JNIS Beautified SVG Animation */
    .handwriting-svg {
      width: 400px; /* Increased size for prominence */
      height: 150px;
      overflow: visible;
    }

    .path-text {
      fill: none;
      stroke: #ffffff;
      stroke-width: 4.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      /* Animation settings */
      animation: writeText 3.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    /* Professional Script Font Simulation Paths (j n i s) */
    .char-j { d: path("M 60 45 L 60 85 C 60 100 45 105 38 95"); }
    .char-j-dot { d: path("M 60 30 m -1.5 0 a 1.5 1.5 0 1 0 3 0 a 1.5 1.5 0 1 0 -3 0"); fill: #ffffff; stroke: none;}

    .char-n { d: path("M 85 85 L 85 55 C 85 45 105 45 105 58 L 105 85"); }

    .char-i { d: path("M 130 55 L 130 85"); }
    .char-i-dot { d: path("M 130 40 m -1.5 0 a 1.5 1.5 0 1 0 3 0 a 1.5 1.5 0 1 0 -3 0"); fill: #ffffff; stroke: none;}

    .char-s { d: path("M 175 58 C 170 50 150 52 152 65 C 154 78 175 72 173 83 C 170 92 150 90 148 82"); }

    @keyframes writeText {
      to {
        stroke-dashoffset: 0;
      }
    }

    /* 2. Middle Button - Larger & Professional */
    .btn-jnii {
      display: inline-block;
      padding: 18px 45px; /* Significantly increased padding */
      font-size: 1.4rem;  /* Larger font size */
      font-weight: 600;
      color: #ffffff;
      text-decoration: none;
      border: 3px solid #ffffff; /* Thicker border */
      border-radius: 8px; /* Slightly smoother corners */
      background: transparent;
      letter-spacing: 1.5px;
      cursor: pointer;
      transition: all 0.3s ease;
      
      /* Animation settings - Fade in and scale up */
      opacity: 0;
      transform: scale(0.9);
      animation: fadeInBtn 0.8s ease-out 3.2s forwards; /* Starts as text completes */
    }

    .btn-jnii:hover {
      background-color: #ffffff;
      color: #0d0d0d;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.5);
      transform: scale(1.05); /* Slightly bigger on hover */
    }

    @keyframes fadeInBtn {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* 3. Bottom Blue Contact Box with Text */
    .blue-box {
      width: 450px; /* Custom width for centered text */
      margin-top: 50px;
      padding: 20px;
      border: 4px solid #4a90e2; /* Blue border */
      border-radius: 10px;
      background-color: transparent;
      opacity: 0;
      animation: fadeInBlue 1s ease-out 4s forwards; /* Starts after button */
    }

    .inquiry-text {
      font-size: 1rem;
      color: #ffffff;
      letter-spacing: 0.5px;
      line-height: 1.6;
    }

    @keyframes fadeInBlue {
      to {
        opacity: 1;
      }
    }

  </style>
</head>
<body>

  <div class="container">
    <!-- JNIS Beautified Handwriting Animation -->
    <svg class="handwriting-svg" viewBox="0 0 320 120">
      <path class="path-text char-j" />
      <path class="char-j-dot" />
      
      <path class="path-text char-n" />
      
      <path class="path-text char-i" />
      <path class="char-i-dot" />
      
      <path class="path-text char-s" />
    </svg>

    <!-- Larger, professional central button -->
    <a href="#" class="btn-jnii">@jnii2008</a>

    <!-- Bottom blue box with Inquiry Text -->
    <div class="blue-box">
      <p class="inquiry-text">Business Inquiries: <br> jnis550088@gmail.com</p>
    </div>
  </div>

</body>
</html>
