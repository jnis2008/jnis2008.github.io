<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>jnis2008</title>
  
  <!-- Open Graph 預覽設定 -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="jnis">
  <meta property="og:description" content="Welcome to jnis personal links.">
  <meta property="og:image" content="og-image.png">

  <!-- 導入方正幾何風格字體 Press Start 2P -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    /* 全局變數 (預設為暗底 Dark Mode) */
    :root {
      --bg-color: #0d0d0d;
      --text-color: #ffffff;
      --border-color: #ffffff;
      --hover-bg: #ffffff;
      --hover-text: #0d0d0d;
      --box-shadow-color: rgba(255, 255, 255, 0.4);
      --glow-color: rgba(255, 255, 255, 0.08);
      --inquiry-base: #888888;
      --inquiry-shine: #ffffff;
      --toast-color: #888888;
      --logo-hover-shadow: rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.6);
    }

    /* 亮底 Theme (Light Mode) */
    body.light-theme {
      --bg-color: #f5f5f5;
      --text-color: #0d0d0d;
      --border-color: #0d0d0d;
      --hover-bg: #0d0d0d;
      --hover-text: #ffffff;
      --box-shadow-color: rgba(0, 0, 0, 0.3);
      --glow-color: rgba(0, 0, 0, 0.06);
      --inquiry-base: #777777;
      --inquiry-shine: #000000;
      --toast-color: #555555;
      --logo-hover-shadow: rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      /* 全局禁止文字反白/選取 */
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      height: 100svh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
      transition: background-color 0.4s ease, color 0.4s ease;
      padding: 0 20px;
    }

    /* ===== 鼠標發光跟隨特效 ===== */
    .cursor-glow {
      position: fixed;
      top: 0;
      left: 0;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--glow-color) 0%, rgba(0,0,0,0) 70%);
      pointer-events: none; /* 防止遮擋鼠標點擊事件 */
      transform: translate(-50%, -50%);
      transition: opacity 0.3s ease;
      z-index: 0;
      will-change: transform;
    }

    /* ===== 左上角切換主題按鈕 ===== */
    .theme-toggle-btn {
      position: absolute;
      top: 40px;
      left: 50px;
      background: transparent;
      border: 2px solid var(--border-color);
      color: var(--text-color);
      padding: 8px 0;
      min-width: 85px;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: 20px;
      cursor: pointer;
      z-index: 100;
      transition: background-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
    }

    .theme-toggle-btn:hover {
      background-color: var(--hover-bg);
      color: var(--hover-text);
      box-shadow: 0 0 15px var(--box-shadow-color);
    }

    /* ===== 左下角返回首頁按鈕 ===== */
    .back-home-btn {
      position: absolute;
      bottom: 40px;
      left: 50px;
      background: transparent;
      border: 2px solid var(--border-color);
      color: var(--text-color);
      padding: 8px 20px;
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: 20px;
      cursor: pointer;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transform: translateY(15px);
      transition: opacity 0.5s ease, transform 0.5s ease, background-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
    }

    .back-home-btn.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .back-home-btn:hover {
      background-color: var(--hover-bg);
      color: var(--hover-text);
      box-shadow: 0 0 15px var(--box-shadow-color);
    }

    /* ===== 右上角固定標題 jnis ===== */
    .top-right-wrapper {
      position: absolute;
      top: 40px;
      right: 50px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      z-index: 100;
    }

    .top-right-logo {
      font-family: 'Press Start 2P', monospace, sans-serif;
      font-size: 2.2rem;
      color: var(--text-color);
      opacity: 0;
      pointer-events: none;
      transform: translateY(-20px);
      transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), text-shadow 0.3s ease;
      cursor: pointer;
    }

    .top-right-logo.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .top-right-logo:hover {
      text-shadow: 0 0 15px var(--logo-hover-shadow);
    }

    /* 動態生成的拋物掉落表情 */
    .falling-kaomoji {
      position: fixed;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-color);
      pointer-events: none;
      white-space: nowrap;
      z-index: 999;
      will-change: transform, opacity;
      animation: dropAndFade 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }

    @keyframes dropAndFade {
      0% {
        opacity: 1;
        transform: translate(0, 0) rotate(0deg) scale(1);
      }
      20% {
        opacity: 1;
        transform: translate(var(--offset-x), -15px) rotate(calc(var(--rot) * 0.3)) scale(1.1);
      }
      100% {
        opacity: 0;
        transform: translate(calc(var(--offset-x) * 1.8), 120px) rotate(var(--rot)) scale(0.85);
      }
    }

    /* 置中主容器 (固定高寬，防跑位) */
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
      height: 100%;
      max-width: 1000px;
      z-index: 1;
      position: relative;
    }

    /* 中央區域：利用 Grid 重疊兩頁內容，支援流暢淡入淡出 */
    .content-stage {
      display: grid;
      place-items: center;
      width: 100%;
      margin: auto 0;
    }

    .hero-content, .links-menu {
      grid-area: 1 / 1;
    }

    /* ===== 首頁居中主要內容 ===== */
    .hero-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 1;
      transform: scale(1);
      transition: opacity 0.5s ease, transform 0.5s ease;
      pointer-events: auto;
    }

    .hero-content.fade-out {
      opacity: 0;
      transform: scale(0.92) translateY(-20px);
      pointer-events: none;
    }

    /* 首頁打字標題 */
    .typewriter-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 65px;
      max-width: 100%;
    }

    .typewriter {
      font-family: 'Press Start 2P', monospace, sans-serif;
      font-size: 6.1rem;
      text-transform: lowercase;
      color: var(--text-color);
      white-space: nowrap;
      overflow: hidden;
      border-right: 6px solid var(--text-color);
      width: 0;
      animation: 
        typing 0.8s cubic-bezier(0.25, 0.1, 0.25, 1) forwards,
        blink-caret 0.6s step-end infinite;
    }

    @keyframes typing {
      from { width: 0; }
      to { width: 385px; }
    }

    @keyframes blink-caret {
      from, to { border-color: transparent; }
      50% { border-color: var(--text-color); }
    }

    /* 首頁中間按鈕 */
    .btn-jnii {
      display: inline-block;
      padding: 18px 46px;
      font-size: 1.43rem;
      font-weight: 600;
      color: var(--text-color);
      text-decoration: none;
      border: 3px solid var(--border-color);
      border-radius: 9px;
      background-color: var(--bg-color);
      letter-spacing: 1.6px;
      cursor: pointer;
      transition: background-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease;
      
      opacity: 0;
      transform: scale(0.92);
      animation: fadeInBtn 0.4s ease-out 0.7s forwards;
    }

    .btn-jnii:hover {
      background-color: var(--hover-bg);
      color: var(--hover-text);
      box-shadow: 0 0 22px var(--box-shadow-color);
      transform: scale(1.03);
    }

    @keyframes fadeInBtn {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* ===== 第二頁選單區域 ===== */
    .links-menu {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      width: 100%;
      max-width: 480px;
      pointer-events: none;
    }

    /* 外層 Wrapper 控制淡入淡出滑動動畫 */
    .white-box-wrapper {
      width: 100%;
      position: relative;
      opacity: 0;
      transform: translateY(40px) scale(0.95);
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), 
                  transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform, opacity;
    }

    .links-menu.active {
      pointer-events: auto;
    }

    .links-menu.active .white-box-wrapper {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .links-menu.active .white-box-wrapper:nth-child(1) { transition-delay: 0.1s; }
    .links-menu.active .white-box-wrapper:nth-child(2) { transition-delay: 0.2s; }
    .links-menu.active .white-box-wrapper:nth-child(3) { transition-delay: 0.3s; }
    .links-menu.active .white-box-wrapper:nth-child(4) { transition-delay: 0.4s; }

    /* 退場時平滑隱藏 */
    .links-menu.fade-out .white-box-wrapper {
      opacity: 0;
      transform: translateY(20px) scale(0.95);
      transition-delay: 0s !important;
    }

    .white-box {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 65px;
      border: 3.5px solid var(--border-color);
      border-radius: 9px;
      background-color: var(--bg-color);
      color: var(--text-color);
      text-decoration: none;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 2px;
      cursor: pointer;
      transition: background-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
      line-height: 1;
    }

    .white-box:hover {
      background-color: var(--hover-bg);
      color: var(--hover-text);
      box-shadow: 0 0 25px var(--box-shadow-color);
    }

    /* ===== YouTube 懸停 / 點擊展開選單 ===== */
    .yt-sub-container {
      display: flex;
      gap: 15px;
      position: absolute;
      top: 100%;
      left: 0;
      width: 100%;
      padding-top: 10px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-5px);
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 20;
    }

    @media (hover: hover) {
      .white-box-wrapper.yt-wrapper:hover .yt-sub-container {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
      }
    }

    .white-box-wrapper.yt-wrapper.open .yt-sub-container {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .yt-btn {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 50px;
      border: 3px solid var(--border-color);
      border-radius: 8px;
      background-color: var(--bg-color);
      color: var(--text-color);
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 1px;
      transition: background-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
      line-height: 1;
    }

    .yt-btn:hover {
      background-color: var(--hover-bg);
      color: var(--hover-text);
      box-shadow: 0 0 18px var(--box-shadow-color);
    }

    /* ===== 底部 Business Inquiries ===== */
    .inquiry-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      padding-bottom: 25px;
    }

    .inquiry-text {
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: 0.9px;
      white-space: nowrap;
      cursor: pointer;
      transition: opacity 0.5s ease, transform 0.5s ease;
      
      background: linear-gradient(90deg, var(--inquiry-base) 0%, var(--inquiry-base) 40%, var(--inquiry-shine) 50%, var(--inquiry-base) 60%, var(--inquiry-base) 100%);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 3s infinite linear;

      opacity: 0;
      max-width: 100%;
    }

    .inquiry-text.init-fadeIn {
      animation: fadeInText 0.6s ease-out 1.1s forwards, shimmer 3s infinite linear;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    @keyframes fadeInText {
      to { opacity: 1; }
    }

    .copied-toast {
      position: absolute;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--toast-color);
      letter-spacing: 1px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .copied-toast.pos-bottom {
      bottom: 55px;
      transform: translateY(5px);
    }

    .copied-toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .inquiry-hidden {
      opacity: 0 !important;
      transform: translateY(15px) !important;
    }

    .inquiry-visible {
      opacity: 1 !important;
      transform: translateY(0) !important;
    }

    /* ==========================================
       📱 手機端 / Instagram 內建瀏覽器專用優化
    ========================================== */
    @media (max-width: 768px) {
      .theme-toggle-btn {
        top: 15px;
        left: 15px;
        padding: 4px 0;
        min-width: 60px;
        font-size: 0.65rem;
      }

      .back-home-btn {
        bottom: 15px;
        left: 15px;
        padding: 4px 12px;
        font-size: 0.65rem;
      }

      .top-right-wrapper {
        top: 15px;
        right: 15px;
      }

      .top-right-logo {
        font-size: 1.2rem;
      }

      .falling-kaomoji {
        font-size: 0.9rem;
      }

      .typewriter-wrapper {
        margin-bottom: 25px;
      }

      .typewriter {
        font-size: 2.1rem;
        border-right-width: 3px;
      }

      @keyframes typing {
        from { width: 0; }
        to { width: 135px; }
      }

      .btn-jnii {
        padding: 8px 20px;
        font-size: 0.82rem;
        border-width: 2px;
      }

      .links-menu {
        gap: 12px;
        max-width: 260px;
      }

      .white-box {
        height: 38px;
        font-size: 0.82rem;
        border-width: 2px;
      }

      .yt-sub-container {
        gap: 8px;
        padding-top: 5px;
      }

      .yt-btn {
        height: 32px;
        font-size: 0.72rem;
        border-width: 2px;
      }

      .inquiry-wrapper {
        padding-bottom: 45px;
      }

      .inquiry-text {
        font-size: 0.65rem;
        letter-spacing: 0.3px;
        white-space: nowrap;
      }

      .copied-toast {
        font-size: 0.65rem;
      }

      .copied-toast.pos-bottom {
        bottom: 70px;
      }
    }

    @media (max-width: 380px) {
      .typewriter {
        font-size: 1.8rem;
      }

      @keyframes typing {
        from { width: 0; }
        to { width: 115px; }
      }

      .links-menu {
        max-width: 230px;
      }

      .inquiry-text {
        font-size: 0.58rem;
      }
    }
  </style>
</head>
<body>

  <!-- 背景鼠標發光跟隨層 -->
  <div class="cursor-glow" id="cursorGlow"></div>

  <!-- 左上角切換暗底/亮底按鈕 -->
  <button class="theme-toggle-btn" id="themeToggleBtn">Dark</button>

  <!-- 左下角返回首頁按鈕 -->
  <button class="back-home-btn" id="backHomeBtn">Home</button>

  <!-- 右上角固定標題 jnis -->
  <div class="top-right-wrapper">
    <div class="top-right-logo" id="topLogo">jnis</div>
  </div>

  <div class="container" id="mainContainer">
    
    <!-- 舞台區域：重疊首頁與選單頁以進行平滑轉場 -->
    <div class="content-stage">
      <!-- 首頁內容 -->
      <div class="hero-content" id="heroContent">
        <div class="typewriter-wrapper" id="homeTitle">
          <h1 class="typewriter">jnis</h1>
        </div>
        <a href="javascript:void(0);" class="btn-jnii" id="btnJnii">@jnii2008</a>
      </div>

      <!-- 第二頁選單 -->
      <div class="links-menu" id="linksMenu">
        <!-- Discord -->
        <div class="white-box-wrapper">
          <a href="https://discord.gg/3TJWX3HFCs" target="_blank" class="white-box">Discord</a>
        </div>

        <!-- Twitch -->
        <div class="white-box-wrapper">
          <a href="https://www.twitch.tv/jnii2008" target="_blank" class="white-box">Twitch</a>
        </div>

        <!-- Instagram -->
        <div class="white-box-wrapper">
          <a href="https://www.instagram.com/jnii2008/" target="_blank" class="white-box">Instagram</a>
        </div>

        <!-- YouTube -->
        <div class="white-box-wrapper yt-wrapper" id="ytWrapper">
          <div class="white-box" id="ytTrigger">YouTube</div>
          <div class="yt-sub-container">
            <a href="https://www.youtube.com/@jnii2008" target="_blank" class="yt-btn">Main</a>
            <a href="https://www.youtube.com/@%E5%82%91%E5%B0%BC4" target="_blank" class="yt-btn">VOD</a>
          </div>
        </div>
      </div>
    </div>

    <!-- 底部聯絡資訊與複製提示 -->
    <div class="inquiry-wrapper">
      <div class="copied-toast pos-bottom" id="copiedToast">Copied!</div>
      <p class="inquiry-text init-fadeIn" id="inquiryText">
        Business Inquiries: jnis550088@gmail.com
      </p>
    </div>
  </div>

  <script>
    const btnJnii = document.getElementById('btnJnii');
    const heroContent = document.getElementById('heroContent');
    const linksMenu = document.getElementById('linksMenu');
    const topLogo = document.getElementById('topLogo');
    const inquiryText = document.getElementById('inquiryText');
    const copiedToast = document.getElementById('copiedToast');
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const backHomeBtn = document.getElementById('backHomeBtn');
    const ytWrapper = document.getElementById('ytWrapper');
    const ytTrigger = document.getElementById('ytTrigger');
    const cursorGlow = document.getElementById('cursorGlow');

    let toastTimeout;

    // 表情符號隨機列表
    const kaomojis = ['><', '(ﾉ∀`*)', '(≧∀≦)ゞ', 'ヾ(*´∀ ˋ*)ﾉ', '(*ﾟ∀ﾟ*)', '(;´༎ຶД༎ຶ`)', '( °3°)', '(つ´ω`)つ'];
    let kaomojiIndex = 0;

    // ===== 鼠標發光跟隨邏輯 =====
    document.addEventListener('mousemove', (e) => {
      cursorGlow.style.left = `${e.clientX}px`;
      cursorGlow.style.top = `${e.clientY}px`;
    });

    document.addEventListener('mouseleave', () => cursorGlow.style.opacity = '0');
    document.addEventListener('mouseenter', () => cursorGlow.style.opacity = '1');

    // ===== 進入第二頁 =====
    btnJnii.addEventListener('click', function() {
      heroContent.classList.add('fade-out');
      inquiryText.classList.remove('init-fadeIn');
      inquiryText.classList.add('inquiry-hidden');

      setTimeout(() => {
        linksMenu.classList.remove('fade-out');
        linksMenu.classList.add('active');
        topLogo.classList.add('visible');
        backHomeBtn.classList.add('visible');

        requestAnimationFrame(() => {
          inquiryText.classList.remove('inquiry-hidden');
          inquiryText.classList.add('inquiry-visible');
        });
      }, 350);
    });

    // ===== 左下角按鈕淡出回到首頁 =====
    backHomeBtn.addEventListener('click', function() {
      linksMenu.classList.add('fade-out');
      linksMenu.classList.remove('active');
      topLogo.classList.remove('visible');
      backHomeBtn.classList.remove('visible');
      inquiryText.classList.add('inquiry-hidden');

      setTimeout(() => {
        heroContent.classList.remove('fade-out');
        ytWrapper.classList.remove('open');

        requestAnimationFrame(() => {
          inquiryText.classList.remove('inquiry-hidden');
          inquiryText.classList.add('inquiry-visible');
        });
      }, 350);
    });

    // 右上角 jnis 點擊爆發拋物掉落表情符號
    topLogo.addEventListener('click', function(e) {
      e.stopPropagation();

      const rect = topLogo.getBoundingClientRect();
      const kaomojiEl = document.createElement('div');
      kaomojiEl.className = 'falling-kaomoji';
      kaomojiEl.textContent = kaomojis[kaomojiIndex];

      kaomojiIndex = (kaomojiIndex + 1) % kaomojis.length;

      const startX = rect.left + rect.width / 2 - 20;
      const startY = rect.bottom + 5;

      const randomOffsetX = (Math.random() - 0.5) * 80 + 'px';
      const randomRotation = (Math.random() - 0.5) * 60 + 'deg';

      kaomojiEl.style.left = startX + 'px';
      kaomojiEl.style.top = startY + 'px';
      kaomojiEl.style.setProperty('--offset-x', randomOffsetX);
      kaomojiEl.style.setProperty('--rot', randomRotation);

      document.body.appendChild(kaomojiEl);

      kaomojiEl.addEventListener('animationend', () => {
        kaomojiEl.remove();
      });
    });

    // YouTube 點擊展開/收合
    ytTrigger.addEventListener('click', function(e) {
      e.stopPropagation();
      ytWrapper.classList.toggle('open');
    });

    // 點擊頁面其他地方自動收合 YouTube 選單
    document.addEventListener('click', function(e) {
      if (!ytWrapper.contains(e.target)) {
        ytWrapper.classList.remove('open');
      }
    });

    // 點擊複製 Email 功能
    inquiryText.addEventListener('click', function() {
      const email = 'jnis550088@gmail.com';
      navigator.clipboard.writeText(email).then(() => {
        copiedToast.classList.add('show');

        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
          copiedToast.classList.remove('show');
        }, 2000);
      });
    });

    // 主題切換
    themeToggleBtn.addEventListener('click', function() {
      document.body.classList.toggle('light-theme');
      if (document.body.classList.contains('light-theme')) {
        themeToggleBtn.textContent = 'Light';
      } else {
        themeToggleBtn.textContent = 'Dark';
      }
    });
  </script>

</body>
</html>
