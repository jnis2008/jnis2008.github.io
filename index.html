<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jnis</title>

  <!-- Open Graph 預覽設定 -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="jnis">
  <meta property="og:description" content="Welcome to jnis personal site.">
  <meta property="og:image" content="og-image.png">

  <style>
    /* ----- 基礎與全域樣式 ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* ----- 1. 鼠標發光特效 (Cursor Glow) ----- */
    .cursor-glow {
      position: fixed;
      top: 0;
      left: 0;
      width: 350px;
      height: 350px;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(255, 255, 255, 0.15) 0%,
        rgba(138, 43, 226, 0.08) 40%,
        rgba(0, 0, 0, 0) 70%
      );
      pointer-events: none; /* 讓鼠標光暈不擋住按鈕點擊 */
      transform: translate(-50%, -50%);
      transition: transform 0.05s ease-out, opacity 0.3s ease;
      z-index: 9999;
      mix-blend-mode: screen;
    }

    /* ----- 頁面切換與淡入淡出效果 ----- */
    .page {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      min-height: 100vh;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .page.active {
      opacity: 1;
      visibility: visible;
    }

    /* ----- 首頁 (Page 1) ----- */
    #home-page h1 {
      font-size: 3rem;
      margin-bottom: 1.5rem;
      letter-spacing: 2px;
    }

    .nav-btn {
      padding: 12px 30px;
      font-size: 1rem;
      color: #fff;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 30px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.5);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    /* ----- 第二頁 (Page 2) ----- */
    #second-page {
      background-color: #080808;
    }

    /* ----- 2. 第二頁左下角返回首頁按鈕 ----- */
    .back-home-btn {
      position: fixed;
      bottom: 30px;
      left: 30px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.7);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      z-index: 100;
      transition: all 0.3s ease;
    }

    .back-home-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.4);
      transform: translateX(-3px);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.1);
    }

    .back-home-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
      transition: transform 0.3s ease;
    }

    .back-home-btn:hover svg {
      transform: translateX(-3px);
    }
  </style>
</head>
<body>

  <!-- 發光鼠標層 -->
  <div class="cursor-glow" id="cursor-glow"></div>

  <!-- 首頁 -->
  <section id="home-page" class="page active">
    <h1>jnis</h1>
    <button class="nav-btn" onclick="navigateTo('second-page')">進入第二頁 →</button>
  </section>

  <!-- 第二頁 -->
  <section id="second-page" class="page">
    <h2>第二頁內容</h2>
    <p style="margin-top: 1rem; color: #888;">這裡可以放置你的專案或介紹內容。</p>

    <!-- 左下角返回首頁按鈕 -->
    <button class="back-home-btn" onclick="navigateTo('home-page')">
      <svg viewBox="0 0 24 24">
        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
      </svg>
      返回首頁
    </button>
  </section>

  <script>
    // ===== 1. 鼠標跟隨發光邏輯 =====
    const glow = document.getElementById('cursor-glow');

    document.addEventListener('mousemove', (e) => {
      // 取得滑鼠座標並更新發光層位置
      glow.style.left = `${e.clientX}px`;
      glow.style.top = `${e.clientY}px`;
    });

    // 當滑鼠離開視窗時隱藏光暈，進入時顯示
    document.addEventListener('mouseleave', () => glow.style.opacity = '0');
    document.addEventListener('mouseenter', () => glow.style.opacity = '1');

    // ===== 2. 頁面平滑淡入淡出切換 =====
    function navigateTo(targetPageId) {
      const activePage = document.querySelector('.page.active');
      const targetPage = document.getElementById(targetPageId);

      if (activePage && activePage.id !== targetPageId) {
        // 先淡出目前頁面
        activePage.classList.remove('active');

        // 待淡出動畫完畢後，淡入目標頁面
        setTimeout(() => {
          targetPage.classList.add('active');
          window.scrollTo(0, 0); // 切換頁面時自動回到頂部
        }, 300);
      }
    }
  </script>
</body>
</html>
