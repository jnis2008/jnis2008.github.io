<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jnis2008</title>
  <style>
    /* 全局黑色背景與基礎樣式 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* 容器佈局 */
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 30px;
      z-index: 10;
    }

    /* 白線畫手寫動畫區域 (SVG) */
    .handwriting-svg {
      width: 320px;
      height: 120px;
      overflow: visible;
    }

    /* 文字與畫筆路徑屬性 */
    .path-text, .hand-drawn {
      fill: none;
      stroke: #ffffff;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* jnis 筆劃動畫 */
    .path-text {
      stroke-width: 4;
      stroke-dasharray: 800;
      stroke-dashoffset: 800;
      animation: writeText 3.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    /* 白線手的筆劃動畫 */
    .path-hand {
      stroke-width: 2.5;
      stroke-dasharray: 400;
      stroke-dashoffset: 400;
      animation: drawHand 1.5s ease-out forwards;
    }

    /* 動畫定義：描邊效果 */
    @keyframes writeText {
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes drawHand {
      to {
        stroke-dashoffset: 0;
      }
    }

    /* 中間淡化入場的白色框按鈕 */
    .btn-jnii {
      opacity: 0;
      transform: translateY(15px);
      display: inline-block;
      padding: 12px 32px;
      font-size: 1.1rem;
      font-weight: 500;
      color: #ffffff;
      text-decoration: none;
      border: 2px solid #ffffff;
      border-radius: 6px;
      background: transparent;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s ease;
      /* 延遲 3.2 秒，等文字快寫完時淡入登場 */
      animation: fadeInBtn 1.2s ease-out 3.2s forwards;
    }

    /* 按鈕懸停（Hover）互動效果 */
    .btn-jnii:hover {
      background-color: #ffffff;
      color: #0d0d0d;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
      transform: translateY(12px);
    }

    /* 按鈕淡入動畫 */
    @keyframes fadeInBtn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- SVG：筆劃寫出 jnis + 手型白線線條 -->
    <svg class="handwriting-svg" viewBox="0 0 320 120">
      <!-- 白線畫手掌與手指輪廓 -->
      <g class="path-hand">
        <!-- 手腕與手掌白線線條 -->
        <path d="M 10 90 Q 25 85 40 90 T 55 85 Q 50 65 40 55 C 35 45 25 45 20 55 Z" />
        <!-- 握筆手指線條 -->
        <path d="M 35 60 C 45 58 55 62 50 72 C 45 78 35 75 30 70" />
      </g>

      <!-- 手寫風格 "jnis" 文字筆劃 -->
      <!-- j -->
      <path class="path-text" d="M 60 45 L 60 85 C 60 100 45 105 38 95" />
      <circle class="path-text" cx="60" cy="30" r="1.5" />

      <!-- n -->
      <path class="path-text" d="M 85 85 L 85 55 C 85 45 105 45 105 58 L 105 85" />

      <!-- i -->
      <path class="path-text" d="M 130 55 L 130 85" />
      <circle class="path-text" cx="130" cy="40" r="1.5" />

      <!-- s -->
      <path class="path-text" d="M 175 58 C 170 50 150 52 152 65 C 154 78 175 72 173 83 C 170 92 150 90 148 82" />
    </svg>

    <!-- 淡入登場的 @jnii2008 白色外框按鈕 -->
    <a href="#" class="btn-jnii">@jnii2008</a>
  </div>

</body>
</html>
