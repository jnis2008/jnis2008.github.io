<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>jnis2008</title>
  <!-- 導入方正幾何風格字體 Press Start 2P -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    /* 全局變數 (預設為暗底 Dark Mode) */
    :root {
      --bg-color: #0d0d0d;
      --text-color: #ffffff;
      --border-color: #ffffff;
      --hover-bg: #ffffff;
      --hover-text: #0d0d0d;
      --box-shadow-color: rgba(255, 255, 255, 0.4);
      --inquiry-base: #888888;
      --inquiry-shine: #ffffff;
      --toast-color: #888888;
      --logo-hover-shadow: rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.6);
    }

    /* 亮底 Theme (Light Mode) */
    body.light-theme {
      --bg-color: #f5f5f5;
      --text-color: #0d0d0d;
      --border-color: #0d0d0d;
      --hover-bg: #0d0d0d;
      --hover-text: #ffffff;
      --box-shadow-color: rgba(0, 0, 0, 0.3);
      --inquiry-base: #777777;
      --inquiry-shine: #000000;
      --toast-color: #555555;
      --logo-hover-shadow: rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      /* 全局禁止文字反白/選取 */
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      height: 100svh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
      transition: background-color 0.4s ease, color 0.4s ease;
      padding: 0 20px;
    }

    /* ===== 左上角切換主題按鈕 ===== */
    .theme-toggle-btn {
      position: absolute;
      top: 40px;
      left: 50px;
      background: transparent;
      border: 2px solid var(--border-color);
      color: var(--text-color);
      padding: 8px 0;
      min-width: 85px;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: 20px;
      cursor: pointer;
      z-index: 100;
      transition: all 0.3s ease;
    }

    .theme-toggle-btn:hover {
      background-color: var(--hover-bg);
      color: var(--hover-text);
      box-shadow: 0 0 15px var(--box-shadow-color);
    }

    /* ===== 右上角固定標題 jnis & 表情符號容器 ===== */
    .top-right-wrapper {
      position: absolute;
      top: 40px;
      right: 50px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      z-index: 100;
    }

    .top-right-logo {
      font-family: 'Press Start 2P', monospace, sans-serif;
      font-size: 2.2rem;
      color: var(--text-color);
      opacity: 0;
      pointer-events: none;
      transform: translateY(-20px);
      transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), text-shadow 0.3s ease;
      cursor: pointer;
    }

    .top-right-logo.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .top-right-logo:hover {
      text-shadow: 0 0 15px var(--logo-hover-shadow);
    }

    /* 右上角點擊出現的自然掉落文字表情 */
    .kaomoji-popup {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-color);
      margin-top: 5px;
      opacity: 0;
      transform: translateY(-10px) scale(0.9);
      transition: opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1), transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
      pointer-events: none;
      white-space: nowrap;
      height: 20px;
    }

    .kaomoji-popup.show {
      opacity: 1;
      transform: translateY(12px) scale(1);
    }

    .kaomoji-popup.fade-out {
      opacity: 0;
      transform: translateY(22px) scale(0.95);
      transition: opacity 0.5s ease-in, transform 0.5s ease-in;
    }

    /* 置中主容器 (固定高寬，防跑位) */
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
      height: 100%;
      max-width: 1000px;
      z-index: 1;
      position: relative;
    }

    /* 中央區域：利用 Grid 重疊兩頁內容，支援流暢淡入淡出 */
    .content-stage {
      display: grid;
      place-items: center;
      width: 100%;
      margin: auto 0;
    }

    .hero-content, .links-menu {
      grid-area: 1 / 1;
    }

    /* ===== 首頁居中主要內容 ===== */
    .hero-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 1;
      transform: scale(1);
      transition: opacity 0.5s ease, transform 0.5s ease;
      pointer-events: auto;
    }

    .hero-content.fade-out {
      opacity: 0;
      transform: scale(0.92) translateY(-20px);
      pointer-events: none;
    }

    /* 首頁打字標題 */
    .typewriter-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 65px;
      max-width: 100%;
    }

    .typewriter {
      font-family: 'Press Start 2P', monospace, sans-serif;
      font-size: 6.1rem;
      text-transform: lowercase;
      color: var(--text-color);
      white-space: nowrap;
      overflow: hidden;
      border-right: 6px solid var(--text-color);
      width: 0;
      animation: 
        typing 0.8s cubic-bezier(0.25, 0.1, 0.25, 1) forwards,
        blink-caret 0.6s step-end infinite;
    }

    @keyframes typing {
      from { width: 0; }
      to { width: 385px; }
    }

    @keyframes blink-caret {
      from, to { border-color: transparent; }
      50% { border-color: var(--text-color); }
    }

    /* 首頁中間按鈕 */
    .btn-jnii {
      display: inline-block;
      padding: 18px 46px;
      font-size: 1.43rem;
      font-weight: 600;
      color: var(--text-color);
      text-decoration: none;
      border: 3px solid var(--border-color);
      border-radius: 9px;
      background-color: var(--bg-color);
      letter-spacing: 1.6px;
      cursor: pointer;
      transition: all 0.3s ease;
      
      opacity: 0;
      transform: scale(0.92);
      animation: fadeInBtn 0.4s ease-out 0.7s forwards;
    }

    .btn-jnii:hover {
      background-color: var(--hover-bg);
      color: var(--hover-text);
      box-shadow: 0 0 22px var(--box-shadow-color);
      transform: scale(1.03);
    }

    @keyframes fadeInBtn {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* ===== 第二頁選單區域 ===== */
    .links-menu {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      width: 100%;
      max-width: 480px;
      pointer-events: none;
    }

    .white-box-wrapper {
      width: 100%;
      position: relative;
      opacity: 0;
      transform: translateY(40px) scale(0.95);
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), 
                  transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .links-menu.active {
      pointer-events: auto;
    }

    .links-menu.active .white-box-wrapper {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .links-menu.active .white-box-wrapper:nth-child(1) { transition-delay: 0.1s; }
    .links-menu.active .white-box-wrapper:nth-child(2) { transition-delay: 0.2s; }
    .links-menu.active .white-box-wrapper:nth-child(3) { transition-delay: 0.3s; }
    .links-menu.active .white-box-wrapper:nth-child(4) { transition-delay: 0.4s; }

    .white-box {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 65px;
      border: 3.5px solid var(--border-color);
      border-radius: 9px;
      background-color: var(--bg-color);
      color: var(--text-color);
      text-decoration: none;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .white-box:hover {
      background-color: var(--hover-bg);
      color: var(--hover-text);
      box-shadow: 0 0 25px var(--box-shadow-color);
    }

    /* ===== YouTube 懸停 / 點擊展開選單 ===== */
    .yt-sub-container {
      display: flex;
      gap: 15px;
      position: absolute;
      top: 100%;
      left: 0;
      width: 100%;
      padding-top: 10px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-5px);
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 20;
    }

    @media (hover: hover) {
      .white-box-wrapper.yt-wrapper:hover .yt-sub-container {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
      }
    }

    .white-box-wrapper.yt-wrapper.open .yt-sub-container {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .yt-btn {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 50px;
      border: 3px solid var(--border-color);
      border-radius: 8px;
      background-color: var(--bg-color);
      color: var(--text-color);
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 1px;
      transition: all 0.3s ease;
    }

    .yt-btn:hover {
      background-color: var(--hover-bg);
      color: var(--hover-text);
      box-shadow: 0 0 18px var(--box-shadow-color);
    }

    /* ===== 底部 Business Inquiries ===== */
    .inquiry-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      padding-bottom: 25px;
    }

    .inquiry-text {
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: 0.9px;
      white-space: nowrap;
      cursor: pointer;
      transition: opacity 0.5s ease, transform 0.5s ease;
      
      background: linear-gradient(90deg, var(--inquiry-base) 0%, var(--inquiry-base) 40%, var(--inquiry-shine) 50%, var(--inquiry-base) 60%, var(--inquiry-base) 100%);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 3s infinite linear;

      opacity: 0;
      max-width: 100%;
    }

    .inquiry-text.init-fadeIn {
      animation: fadeInText 0.6s ease-out 1.1s forwards, shimmer 3s infinite linear;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    @keyframes fadeInText {
      to { opacity: 1; }
    }

    .copied-toast {
      position: absolute;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--toast-color);
      letter-spacing: 1px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .copied-toast.pos-bottom {
      bottom: 55px;
      transform: translateY(5px);
    }

    .copied-toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .inquiry-hidden {
      opacity: 0 !important;
      transform: translateY(15px) !important;
    }

    .inquiry-visible {
      opacity: 1 !important;
      transform: translateY(0) !important;
    }

    /* ==========================================
       📱 手機端 / Instagram 內建瀏覽器專用優化
    ========================================== */
    @media (max-width: 768px) {
      .theme-toggle-btn {
        top: 15px;
        left: 15px;
        padding: 4px 0;
        min-width: 60px;
        font-size: 0.65rem;
      }

      .top-right-wrapper {
        top: 15px;
        right: 15px;
      }

      .top-right-logo {
        font-size: 1.2rem;
      }

      .kaomoji-popup {
        font-size: 0.8rem;
        margin-top: 3px;
      }

      .typewriter-wrapper {
        margin-bottom: 25px;
      }

      .typewriter {
        font-size: 2.1rem;
        border-right-width: 3px;
      }

      @keyframes typing {
        from { width: 0; }
        to { width: 135px; }
      }

      .btn-jnii {
        padding: 8px 20px;
        font-size: 0.82rem;
        border-width: 2px;
      }

      .links-menu {
        gap: 12px;
        max-width: 260px;
      }

      .white-box {
        height: 38px;
        font-size: 0.82rem;
        border-width: 2px;
      }

      .yt-sub-container {
        gap: 8px;
        padding-top: 5px;
      }

      .yt-btn {
        height: 32px;
        font-size: 0.72rem;
        border-width: 2px;
      }

      /* 手機端底部文字向上移動避開導覽列 */
      .inquiry-wrapper {
        padding-bottom: 45px;
      }

      .inquiry-text {
        font-size: 0.65rem;
        letter-spacing: 0.3px;
        white-space: nowrap;
      }

      .copied-toast {
        font-size: 0.65rem;
      }

      .copied-toast.pos-bottom {
        bottom: 70px;
      }
    }

    @media (max-width: 380px) {
      .typewriter {
        font-size: 1.8rem;
      }

      @keyframes typing {
        from { width: 0; }
        to { width: 115px; }
      }

      .links-menu {
        max-width: 230px;
      }

      .inquiry-text {
        font-size: 0.58rem;
      }
    }
  </style>
</head>
<body>

  <!-- 左上角切換暗底/亮底按鈕 -->
  <button class="theme-toggle-btn" id="themeToggleBtn">Dark</button>

  <!-- 右上角固定標題 jnis 與表情包顯示容器 -->
  <div class="top-right-wrapper">
    <div class="top-right-logo" id="topLogo">jnis</div>
    <div class="kaomoji-popup" id="kaomojiPopup"></div>
  </div>

  <div class="container" id="mainContainer">
    
    <!-- 舞台區域：重疊首頁與選單頁以進行平滑轉場 -->
    <div class="content-stage">
      <!-- 首頁內容 -->
      <div class="hero-content" id="heroContent">
        <div class="typewriter-wrapper" id="homeTitle">
          <h1 class="typewriter">jnis</h1>
        </div>
        <a href="javascript:void(0);" class="btn-jnii" id="btnJnii">@jnii2008</a>
      </div>

      <!-- 第二頁選單 -->
      <div class="links-menu" id="linksMenu">
        <!-- Discord -->
        <div class="white-box-wrapper">
          <a href="https://discord.gg/3TJWX3HFCs" target="_blank" class="white-box">Discord</a>
        </div>

        <!-- Twitch -->
        <div class="white-box-wrapper">
          <a href="https://www.twitch.tv/jnii2008" target="_blank" class="white-box">Twitch</a>
        </div>

        <!-- Instagram -->
        <div class="white-box-wrapper">
          <a href="https://www.instagram.com/jnii2008/" target="_blank" class="white-box">Instagram</a>
        </div>

        <!-- YouTube -->
        <div class="white-box-wrapper yt-wrapper" id="ytWrapper">
          <div class="white-box" id="ytTrigger">YouTube</div>
          <div class="yt-sub-container">
            <a href="https://www.youtube.com/@jnii2008" target="_blank" class="yt-btn">Main</a>
            <a href="https://www.youtube.com/@%E5%82%91%E5%B0%BC4" target="_blank" class="yt-btn">VOD</a>
          </div>
        </div>
      </div>
    </div>

    <!-- 底部聯絡資訊與複製提示 -->
    <div class="inquiry-wrapper">
      <div class="copied-toast pos-bottom" id="copiedToast">Copied!</div>
      <p class="inquiry-text init-fadeIn" id="inquiryText">
        Business Inquiries: jnis550088@gmail.com
      </p>
    </div>
  </div>

  <script>
    const btnJnii = document.getElementById('btnJnii');
    const heroContent = document.getElementById('heroContent');
    const linksMenu = document.getElementById('linksMenu');
    const topLogo = document.getElementById('topLogo');
    const kaomojiPopup = document.getElementById('kaomojiPopup');
    const inquiryText = document.getElementById('inquiryText');
    const copiedToast = document.getElementById('copiedToast');
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const ytWrapper = document.getElementById('ytWrapper');
    const ytTrigger = document.getElementById('ytTrigger');

    let toastTimeout;
    let kaomojiTimeoutShow;
    let kaomojiTimeoutHide;

    // 表情符號循環列表
    const kaomojis = ['><', '(ﾉ∀`*)', '(≧∀≦)ゞ', 'ヾ(*´∀ ˋ*)ﾉ'];
    let kaomojiIndex = 0;

    // 頁面切換 logic (流暢淡入淡出)
    btnJnii.addEventListener('click', function() {
      heroContent.classList.add('fade-out');
      inquiryText.classList.remove('init-fadeIn');
      inquiryText.classList.add('inquiry-hidden');

      setTimeout(() => {
        linksMenu.classList.add('active');
        topLogo.classList.add('visible');

        requestAnimationFrame(() => {
          inquiryText.classList.remove('inquiry-hidden');
          inquiryText.classList.add('inquiry-visible');
        });
      }, 350);
    });

    // 右上角 jnis 點擊自然掉落與淡出表情符號
    topLogo.addEventListener('click', function(e) {
      e.stopPropagation();

      // 清除舊動畫計時器
      clearTimeout(kaomojiTimeoutShow);
      clearTimeout(kaomojiTimeoutHide);

      // 重設狀態
      kaomojiPopup.classList.remove('show', 'fade-out');
      kaomojiPopup.textContent = kaomojis[kaomojiIndex];

      // 強制重繪觸發動畫
      void kaomojiPopup.offsetWidth;

      // 掉落與淡入
      kaomojiPopup.classList.add('show');

      // 下一次點擊切換下一個表情
      kaomojiIndex = (kaomojiIndex + 1) % kaomojis.length;

      // 停留後繼續沉降淡出
      kaomojiTimeoutShow = setTimeout(() => {
        kaomojiPopup.classList.remove('show');
        kaomojiPopup.classList.add('fade-out');
      }, 1800);

      // 動畫結束後徹底重置
      kaomojiTimeoutHide = setTimeout(() => {
        kaomojiPopup.classList.remove('fade-out');
      }, 2300);
    });

    // YouTube 點擊展開/收合
    ytTrigger.addEventListener('click', function(e) {
      e.stopPropagation();
      ytWrapper.classList.toggle('open');
    });

    // 點擊頁面其他地方自動收合 YouTube 選單
    document.addEventListener('click', function(e) {
      if (!ytWrapper.contains(e.target)) {
        ytWrapper.classList.remove('open');
      }
    });

    // 點擊複製 Email 功能
    inquiryText.addEventListener('click', function() {
      const email = 'jnis550088@gmail.com';
      navigator.clipboard.writeText(email).then(() => {
        copiedToast.classList.add('show');

        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
          copiedToast.classList.remove('show');
        }, 2000);
      });
    });

    // 主題切換
    themeToggleBtn.addEventListener('click', function() {
      document.body.classList.toggle('light-theme');
      if (document.body.classList.contains('light-theme')) {
        themeToggleBtn.textContent = 'Light';
      } else {
        themeToggleBtn.textContent = 'Dark';
      }
    });
  </script>

</body>
</html>
