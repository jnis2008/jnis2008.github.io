<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Hub</title>
    <!-- 引入 Google Fonts: Press Start 2P (像素風) & Orbitron (科技感) -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewport='0 0 24 24' style='fill:black;font-size:16px;'><text y='20'>👉</text></svg>"), auto;
        }

        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            font-family: 'Orbitron', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* 背景網格與裝飾線條 */
        body::before {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-40px, -40px); }
        }

        /* 主容器 */
        .container {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 480px;
            background: rgba(15, 23, 42, 0.75);
            border: 2px solid #334155;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(56, 189, 248, 0.05);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .container:hover {
            border-color: #38bdf8;
            box-shadow: 0 0 40px rgba(56, 189, 248, 0.2), inset 0 0 20px rgba(56, 189, 248, 0.1);
        }

        /* 頂部資訊列 */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 0.85rem;
            color: #94a3b8;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 12px;
        }

        .date-display {
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
        }

        .action-icon {
            font-size: 1.2rem;
            cursor: pointer;
            transition: transform 0.2s;
            user-select: none;
        }

        .action-icon:hover {
            transform: scale(1.2);
        }

        /* 個人檔案區 */
        .profile-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .avatar-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 15px auto;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid #38bdf8;
            object-fit: cover;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
            background-color: #1e293b;
        }

        .status-dot {
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 16px;
            height: 16px;
            background-color: #22c55e;
            border: 3px solid #0f172a;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        .name {
            font-size: 1.5rem;
            font-weight: 900;
            color: #f8fafc;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .bio {
            font-size: 0.85rem;
            color: #94a3b8;
            font-family: 'Press Start 2P', cursive;
            font-size: 9px;
            line-height: 1.6;
        }

        /* 導航按鈕區 */
        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid #334155;
            color: #f1f5f9;
            padding: 14px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.1), transparent);
            transition: 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            background: rgba(56, 189, 248, 0.15);
            border-color: #38bdf8;
            color: #38bdf8;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.2);
        }

        .btn-icon {
            font-size: 1.1rem;
        }

        /* 返回按鈕 (隱藏/顯示控制) */
        .back-btn {
            display: none;
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.4);
            color: #f87171;
            margin-bottom: 15px;
        }
        .back-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: #ef4444;
            color: #ef4444;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
        }

        /* 頁面切換控制容器 */
        .page-content {
            display: none;
            animation: fadeIn 0.3s ease forwards;
        }

        .page-content.active {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 頁尾版權 */
        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 0.75rem;
            color: #64748b;
        }

        /* 滑鼠軌跡像素心心 */
        .pixel-heart {
            position: absolute;
            pointer-events: none;
            font-size: 12px;
            user-select: none;
            animation: floatUp 0.8s ease-out forwards;
            z-index: 9999;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-35px) scale(1.4); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 頂部資訊列 -->
        <div class="header-bar">
            <div class="date-display" id="dateDisplay">Loading...</div>
            <div class="action-icon" id="reactionBtn" title="點擊獲得愛心">💖</div>
        </div>

        <!-- 首頁主選單 -->
        <div class="page-content active" id="homePage">
            <div class="profile-section">
                <div class="avatar-container">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=300&auto=format&fit=crop" alt="Avatar" class="avatar">
                    <div class="status-dot"></div>
                </div>
                <h1 class="name">PLAYER HUB</h1>
                <p class="bio">TACTICAL / EDITING / TECHWEAR</p>
            </div>

            <div class="nav-links">
                <a href="https://www.twitch.tv" target="_blank" class="btn">
                    <span>Twitch Stream</span>
                    <span class="btn-icon">📺</span>
                </a>
                <button class="btn" onclick="switchPage('youtubePage')">
                    <span>YouTube Channels</span>
                    <span class="btn-icon">▶️</span>
                </button>
                <a href="https://discord.com" target="_blank" class="btn">
                    <span>Discord Community</span>
                    <span class="btn-icon">💬</span>
                </a>
                <a href="https://github.com" target="_blank" class="btn">
                    <span>GitHub Projects</span>
                    <span class="btn-icon">⚡</span>
                </a>
            </div>
        </div>

        <!-- YouTube 子選單頁面 -->
        <div class="page-content" id="youtubePage">
            <button class="btn back-btn" onclick="switchPage('homePage')">
                <span class="btn-icon">⬅</span>
                <span>Back to Menu</span>
            </button>

            <div class="profile-section" style="margin-bottom: 20px;">
                <h2 class="name" style="font-size: 1.2rem;">YouTube Portals</h2>
                <p class="bio">SELECT A CHANNEL</p>
            </div>

            <div class="nav-links">
                <a href="https://www.youtube.com" target="_blank" class="btn">
                    <span>Main Channel</span>
                    <span class="btn-icon">🔥</span>
                </a>
                <a href="https://www.youtube.com/@%E5%82%91%E5%B0%BC4" target="_blank" class="btn">
                    <span>VOD Channel</span>
                    <span class="btn-icon">📼</span>
                </a>
            </div>
        </div>

        <!-- 頁尾 -->
        <div class="footer">
            &copy; 2026. All Rights Reserved.
        </div>
    </div>

    <script>
        // 即時時鐘與日期更新
        function updateClockAndDate() {
            const now = new Date();
            const options = { month: 'short', day: 'numeric', year: 'numeric' };
            const dateStr = now.toLocaleDateString('en-US', options);
            document.getElementById('dateDisplay').textContent = dateStr;
        }
        updateClockAndDate();

        // 頁面切換邏輯
        function switchPage(pageId) {
            document.querySelectorAll('.page-content').forEach(page => {
                page.classList.remove('active');
            });
            document.getElementById(pageId).classList.add('active');
        }

        // 滑鼠點擊產生像素愛心特效
        document.addEventListener('click', function(e) {
            // 避免點擊按鈕連結時視覺雜亂，可自由決定是否全域觸發
            const heart = document.createElement('div');
            heart.className = 'pixel-heart';
            heart.textContent = '❤️';
            heart.style.left = (e.pageX - 6) + 'px';
            heart.style.top = (e.pageY - 10) + 'px';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 800);
        });

        // 右上角表情按鈕互動
        const reactionBtn = document.getElementById('reactionBtn');
        const emojis = ['💖', '✨', '🔥', '⚡', '👾', '🚀'];
        reactionBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // 防止觸發全域點擊
            const randomEmoji = emojis[Math.floor(Math.random() * emojis.length)];
            reactionBtn.textContent = randomEmoji;
            setTimeout(() => {
                reactionBtn.textContent = '💖';
            }, 1000);
        });
    </script>
</body>
</html>
