<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jnis2008</title>
  <!-- 導入美化手寫字體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
  <style>
    /* 全局樣式 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* 置中容器 */
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
      max-width: 800px;
    }

    /* 1. 打字機動畫美化文字 (jnis) */
    .typewriter-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 35px;
    }

    .typewriter {
      font-family: 'Permanent Marker', cursive, cursive-style;
      font-size: 5rem;
      letter-spacing: 6px;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      border-right: 4px solid #ffffff; /* 打字機游標 */
      width: 0;
      /* 1.2 秒快速打字完成，游標打完後消失 */
      animation: 
        typing 1.2s steps(4, end) forwards,
        blink-caret 0.6s step-end 3 forwards;
    }

    @keyframes typing {
      from { width: 0; }
      to { width: 200px; } /* 適配 jnis 寬度 */
    }

    @keyframes blink-caret {
      from, to { border-color: transparent; }
      50% { border-color: #ffffff; }
    }

    /* 2. 中間按鈕 - 加速登場 */
    .btn-jnii {
      display: inline-block;
      padding: 16px 42px;
      font-size: 1.3rem;
      font-weight: 600;
      color: #ffffff;
      text-decoration: none;
      border: 3px solid #ffffff;
      border-radius: 8px;
      background: transparent;
      letter-spacing: 1.5px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 70px; /* 與底部文字拉開距離 */
      
      /* 打字快完時快速淡入（延遲縮短至 0.8s） */
      opacity: 0;
      transform: scale(0.92);
      animation: fadeInBtn 0.4s ease-out 0.8s forwards;
    }

    .btn-jnii:hover {
      background-color: #ffffff;
      color: #0d0d0d;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
      transform: scale(1.03);
    }

    @keyframes fadeInBtn {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* 3. 底部文字 - 水平單行、無藍框、微調偏下 */
    .inquiry-text {
      font-size: 1rem;
      color: #aaaaaa;
      letter-spacing: 0.8px;
      white-space: nowrap; /* 確保保持單行 */
      
      opacity: 0;
      animation: fadeInText 0.6s ease-out 1.2s forwards;
    }

    .inquiry-text a {
      color: #ffffff;
      text-decoration: none;
      font-weight: 500;
    }

    .inquiry-text a:hover {
      text-decoration: underline;
    }

    @keyframes fadeInText {
      to {
        opacity: 1;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 打字機登場的美化 jnis -->
    <div class="typewriter-wrapper">
      <h1 class="typewriter">jnis</h1>
    </div>

    <!-- 加速登場的中間按鈕 -->
    <a href="#" class="btn-jnii">@jnii2008</a>

    <!-- 底部單行商務聯絡文字（無藍框） -->
    <p class="inquiry-text">
      Business Inquiries: <a href="mailto:jnis550088@gmail.com">jnis550088@gmail.com</a>
    </p>
  </div>

</body>
</html>
