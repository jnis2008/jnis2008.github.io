<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jnis2008</title>
  <!-- 導入方正幾何風格字體 Press Start 2P -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    /* 全局樣式 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* 置中容器 */
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
      max-width: 1000px;
    }

    /* 1. jnis 標題 (175%) - 間隔稍微加大 */
    .typewriter-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 65px; /* 加大與下方按鈕的間隔 */
    }

    .typewriter {
      font-family: 'Press Start 2P', monospace, sans-serif;
      font-size: 6.1rem;
      text-transform: lowercase;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      border-right: 6px solid #ffffff;
      width: 0;
      animation: 
        typing 0.8s cubic-bezier(0.25, 0.1, 0.25, 1) forwards,
        blink-caret 0.6s step-end infinite;
    }

    @keyframes typing {
      from { width: 0; }
      to { width: 385px; }
    }

    @keyframes blink-caret {
      from, to { border-color: transparent; }
      50% { border-color: #ffffff; }
    }

    /* 2. 中間按鈕 (110%) */
    .btn-jnii {
      display: inline-block;
      padding: 18px 46px;
      font-size: 1.43rem;
      font-weight: 600;
      color: #ffffff;
      text-decoration: none;
      border: 3px solid #ffffff;
      border-radius: 9px;
      background: transparent;
      letter-spacing: 1.6px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 77px;
      
      opacity: 0;
      transform: scale(0.92);
      animation: fadeInBtn 0.4s ease-out 0.7s forwards;
    }

    .btn-jnii:hover {
      background-color: #ffffff;
      color: #0d0d0d;
      box-shadow: 0 0 22px rgba(255, 255, 255, 0.4);
      transform: scale(1.03);
    }

    @keyframes fadeInBtn {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* 3. 底部商務聯絡資訊 (110%) */
    .inquiry-text {
      font-size: 1.1rem;
      color: #aaaaaa;
      letter-spacing: 0.9px;
      white-space: nowrap;
      
      opacity: 0;
      animation: fadeInText 0.6s ease-out 1.1s forwards;
    }

    @keyframes fadeInText {
      to {
        opacity: 1;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- jnis 打字標題 -->
    <div class="typewriter-wrapper">
      <h1 class="typewriter">jnis</h1>
    </div>

    <!-- 中間按鈕 -->
    <a href="#" class="btn-jnii">@jnii2008</a>

    <!-- 底部聯絡資訊 -->
    <p class="inquiry-text">
      Business Inquiries: jnis550088@gmail.com
    </p>
  </div>

</body>
</html>
